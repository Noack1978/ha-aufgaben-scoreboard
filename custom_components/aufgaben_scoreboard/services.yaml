# Beschreibung der Services für die Anzeige in "Entwicklerwerkzeuge ->
# Aktionen" sowie im Automatisierungs-Editor von Home Assistant.

add_task:
  name: Aufgabe anlegen
  description: >-
    Legt eine neue Aufgabe an. Nur für Administratoren.
  fields:
    name:
      name: Titel
      description: Kurzer, aussagekräftiger Titel der Aufgabe.
      required: true
      example: "Küche aufräumen"
      selector:
        text:
    description:
      name: Beschreibung
      description: Optionale, ausführlichere Beschreibung der Aufgabe.
      required: false
      example: "Geschirrspüler ein- und ausräumen, Arbeitsflächen abwischen"
      selector:
        text:
          multiline: true
    score:
      name: Punkte
      description: Anzahl der Punkte, die die Aufgabe bei Erledigung einbringt.
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    assigned_to:
      name: Zugewiesene Benutzer
      description: >-
        Home-Assistant-Benutzer, denen die Aufgabe zugewiesen wird. Wird
        nichts angegeben, ist die Aufgabe für alle Benutzer offen.
      required: false
      selector:
        text:
          multiple: true

update_task:
  name: Aufgabe bearbeiten
  description: >-
    Bearbeitet eine bestehende Aufgabe nachträglich (Titel, Beschreibung,
    Punktzahl und/oder Zuweisung). Nur angegebene Felder werden geändert.
    Nur für Administratoren.
  fields:
    task_id:
      name: Aufgaben-ID
      description: Die eindeutige ID der zu bearbeitenden Aufgabe.
      required: true
      selector:
        text:
    name:
      name: Titel
      description: Neuer Titel der Aufgabe (optional, unverändert wenn leer).
      required: false
      example: "Küche aufräumen"
      selector:
        text:
    description:
      name: Beschreibung
      description: Neue Beschreibung der Aufgabe (optional).
      required: false
      selector:
        text:
          multiline: true
    score:
      name: Punkte
      description: Neue Punktzahl der Aufgabe (optional).
      required: false
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    assigned_to:
      name: Zugewiesene Benutzer
      description: >-
        Vollständig neue Liste der zugewiesenen Benutzer (ersetzt die
        bisherige Zuweisung). Leere Liste = für alle Benutzer offen. Wird
        das Feld komplett weggelassen, bleibt die bisherige Zuweisung
        unverändert.
      required: false
      selector:
        text:
          multiple: true

remove_task:
  name: Aufgabe löschen
  description: Entfernt eine Aufgabe unwiderruflich. Nur für Administratoren.
  fields:
    task_id:
      name: Aufgaben-ID
      description: Die eindeutige ID der zu löschenden Aufgabe.
      required: true
      selector:
        text:

assign_task:
  name: Aufgabe zuweisen
  description: Weist eine bestehende Aufgabe einem weiteren Benutzer zu. Nur für Administratoren.
  fields:
    task_id:
      name: Aufgaben-ID
      description: Die eindeutige ID der Aufgabe.
      required: true
      selector:
        text:
    user_id:
      name: Benutzer-ID
      description: Die interne Home-Assistant-Benutzer-ID.
      required: true
      selector:
        text:

unassign_task:
  name: Zuweisung entfernen
  description: Entfernt die Zuweisung eines Benutzers von einer Aufgabe. Nur für Administratoren.
  fields:
    task_id:
      name: Aufgaben-ID
      description: Die eindeutige ID der Aufgabe.
      required: true
      selector:
        text:
    user_id:
      name: Benutzer-ID
      description: Die interne Home-Assistant-Benutzer-ID.
      required: true
      selector:
        text:

complete_task:
  name: Aufgabe erledigen
  description: >-
    Meldet eine Aufgabe als erledigt. Schreibt NOCH KEINE Punkte gut,
    sondern setzt die Aufgabe in den Status "wartet auf Freigabe" - ein
    Administrator muss sie über approve_task erst freigeben. Wird keine
    Benutzer-ID angegeben, wird der aufrufende Benutzer verwendet.
  fields:
    task_id:
      name: Aufgaben-ID
      description: Die eindeutige ID der Aufgabe.
      required: true
      selector:
        text:
    user_id:
      name: Benutzer-ID
      description: >-
        Optionale Benutzer-ID. Ohne Angabe wird der aufrufende Benutzer
        verwendet (Standardfall bei Nutzung über die Custom Card).
      required: false
      selector:
        text:

approve_task:
  name: Erledigung freigeben
  description: >-
    Gibt eine als erledigt gemeldete Aufgabe frei: schreibt dem
    meldenden Benutzer die Punkte gut und trägt die Erledigung in die
    Historie ein. Nur für Administratoren.
  fields:
    task_id:
      name: Aufgaben-ID
      description: Die eindeutige ID der Aufgabe, die auf Freigabe wartet.
      required: true
      selector:
        text:

reject_task:
  name: Erledigung ablehnen
  description: >-
    Lehnt eine als erledigt gemeldete Aufgabe ab - keine Punkte, die
    Aufgabe wird wieder offen und kann erneut erledigt werden. Nur für
    Administratoren.
  fields:
    task_id:
      name: Aufgaben-ID
      description: Die eindeutige ID der Aufgabe, die auf Freigabe wartet.
      required: true
      selector:
        text:

undo_completion:
  name: Erledigung zurücknehmen
  description: >-
    Nimmt eine bereits freigegebene Erledigung nachträglich zurück -
    zieht die Punkte wieder ab und öffnet die ursprüngliche Aufgabe
    erneut (sofern sie noch existiert). Nur innerhalb eines begrenzten
    Zeitraums und einer begrenzten Anzahl letzter Erledigungen pro
    Benutzer möglich. Nur für Administratoren.
  fields:
    completion_id:
      name: Erledigungs-ID
      description: Die eindeutige ID des Erledigungs-Eintrags (aus der Historie).
      required: true
      selector:
        text:

reset_score:
  name: Punktestand zurücksetzen
  description: >-
    Setzt den Punktestand eines Benutzers auf 0 zurück und löscht dabei
    auch dessen komplette Erledigungs-Historie. Nur für Administratoren.
  fields:
    user_id:
      name: Benutzer-ID
      description: Die interne Home-Assistant-Benutzer-ID.
      required: true
      selector:
        text:

perform_awards:
  name: Siegerehrung durchführen
  description: >-
    Ermittelt den/die Benutzer mit dem aktuell höchsten Punktestand
    (bei Gleichstand gewinnen alle gleichermaßen) und erhöht deren
    Sieg-Zähler dauerhaft um 1. Ist das Prämien-System aktiviert, wird
    zusätzlich jedem Benutzer sein aktueller Punktestand aufs
    Punktekonto gutgeschrieben. Anschließend werden ALLE Punktestände
    gleichzeitig auf 0 zurückgesetzt (neue Runde beginnt). Nur für
    Administratoren.

reset_wins:
  name: Sieg-Zähler zurücksetzen
  description: Setzt den Sieg-Zähler eines einzelnen Benutzers auf 0 zurück. Nur für Administratoren.
  fields:
    user_id:
      name: Benutzer-ID
      description: Die interne Home-Assistant-Benutzer-ID.
      required: true
      selector:
        text:

add_reward:
  name: Prämie anlegen
  description: >-
    Legt eine neue Prämie an, die gegen Punktekonto-Guthaben eingelöst
    werden kann. Nur relevant, wenn das Prämien-System aktiviert ist.
    Nur für Administratoren.
  fields:
    name:
      name: Titel
      description: Kurzer, aussagekräftiger Titel.
      required: true
      example: "Kinobesuch"
      selector:
        text:
    description:
      name: Beschreibung
      description: Optionale, ausführlichere Beschreibung.
      required: false
      selector:
        text:
          multiline: true
    cost:
      name: Preis
      description: Anzahl der Punkte, die beim Einlösen vom Punktekonto abgezogen werden.
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    reward_type:
      name: Typ
      description: >-
        "generic" = einfache Aktivität, nur Protokollierung + Event
        (z. B. für eigene Automationen). "internet_time" = schaltet
        beim Einlösen eine hinterlegte switch-Entität für die
        angegebene Dauer ein.
      required: false
      default: generic
      selector:
        select:
          options:
            - "generic"
            - "internet_time"
    switch_entity_id:
      name: Zu schaltende Entität
      description: Nur bei Typ "internet_time" - die switch-Entität, die beim Einlösen ein-/nach Ablauf wieder ausgeschaltet wird.
      required: false
      selector:
        entity:
          domain: switch
    duration_minutes:
      name: Dauer (Minuten)
      description: Nur bei Typ "internet_time" - wie lange die Entität eingeschaltet bleibt.
      required: false
      selector:
        number:
          min: 1
          max: 1440
          mode: box

update_reward:
  name: Prämie bearbeiten
  description: >-
    Bearbeitet eine bestehende Prämie nachträglich. Nur angegebene
    Felder werden geändert. Nur für Administratoren.
  fields:
    reward_id:
      name: Prämien-ID
      description: Die eindeutige ID der zu bearbeitenden Prämie.
      required: true
      selector:
        text:
    name:
      name: Titel
      required: false
      selector:
        text:
    description:
      name: Beschreibung
      required: false
      selector:
        text:
          multiline: true
    cost:
      name: Preis
      required: false
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    reward_type:
      name: Typ
      required: false
      selector:
        select:
          options:
            - "generic"
            - "internet_time"
    switch_entity_id:
      name: Zu schaltende Entität
      required: false
      selector:
        entity:
          domain: switch
    duration_minutes:
      name: Dauer (Minuten)
      required: false
      selector:
        number:
          min: 1
          max: 1440
          mode: box

remove_reward:
  name: Prämie löschen
  description: >-
    Entfernt eine Prämie unwiderruflich. Bereits erfolgte Einlösungen
    bleiben in der Historie erhalten. Nur für Administratoren.
  fields:
    reward_id:
      name: Prämien-ID
      description: Die eindeutige ID der zu löschenden Prämie.
      required: true
      selector:
        text:

request_redemption:
  name: Prämie anfragen
  description: >-
    Fordert eine Prämie an - prüft das Guthaben und legt bei Erfolg
    eine Anfrage an, die erst durch einen Administrator freigegeben
    werden muss (analog zur Aufgaben-Erledigung). Wird keine
    Benutzer-ID angegeben, wird der aufrufende Benutzer verwendet.
  fields:
    reward_id:
      name: Prämien-ID
      description: Die eindeutige ID der gewünschten Prämie.
      required: true
      selector:
        text:
    user_id:
      name: Benutzer-ID
      description: Optionale Benutzer-ID. Ohne Angabe wird der aufrufende Benutzer verwendet.
      required: false
      selector:
        text:

approve_redemption:
  name: Einlösung freigeben
  description: >-
    Gibt eine angefragte Prämien-Einlösung frei: bucht die Punkte vom
    Guthaben ab und schaltet bei "internet_time"-Prämien die
    hinterlegte Entität ein. Nur für Administratoren.
  fields:
    redemption_id:
      name: Einlösungs-ID
      description: Die eindeutige ID der Einlösungs-Anfrage.
      required: true
      selector:
        text:

reject_redemption:
  name: Einlösung ablehnen
  description: >-
    Lehnt eine angefragte Prämien-Einlösung ab - kein Punktabzug. Nur
    für Administratoren.
  fields:
    redemption_id:
      name: Einlösungs-ID
      description: Die eindeutige ID der Einlösungs-Anfrage.
      required: true
      selector:
        text:

add_template:
  name: Standardaufgabe anlegen
  description: >-
    Legt eine wiederverwendbare Standardaufgabe (Vorlage) an, aus der
    sich später jederzeit erneut konkrete Aufgaben erzeugen lassen -
    manuell per Button, automatisch per Entitäts-Trigger und/oder
    automatisch per Zeitplan (beide Trigger-Arten sind gleichzeitig
    nutzbar). Nur für Administratoren.
  fields:
    name:
      name: Titel
      description: Kurzer, aussagekräftiger Titel.
      required: true
      example: "Rasen mähen"
      selector:
        text:
    description:
      name: Beschreibung
      description: Optionale, ausführlichere Beschreibung.
      required: false
      selector:
        text:
          multiline: true
    score:
      name: Punkte
      description: Anzahl der Punkte, die eine daraus erzeugte Aufgabe bei Erledigung einbringt.
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    assigned_to:
      name: Zugewiesene Benutzer
      description: >-
        Home-Assistant-Benutzer, denen daraus erzeugte Aufgaben
        zugewiesen werden. Wird nichts angegeben, ist die Aufgabe für
        alle Benutzer offen (bei aktiviertem Multiscoring ist mindestens
        ein Benutzer erforderlich).
      required: false
      selector:
        text:
          multiple: true
    multiscoring:
      name: Multiscoring
      description: >-
        Bei Aktivierung wird beim Anlegen aus dieser Vorlage für JEDEN
        zugewiesenen Benutzer eine eigene, unabhängig erledigbare
        Aufgabe erzeugt (statt einer gemeinsamen) - jeder kann so
        eigene Punkte sammeln.
      required: false
      default: false
      selector:
        boolean:
    trigger_entity_id:
      name: Auslösende Entität
      description: >-
        Optional. Sobald diese Entität den unten angegebenen Zielwert
        erreicht, wird automatisch eine Aufgabe aus dieser Vorlage
        angelegt - sofern nicht bereits eine offene Aufgabe daraus
        existiert (Duplikat-Schutz).
      required: false
      selector:
        entity:
    trigger_state:
      name: Ziel-Zustand ("zu")
      description: Der Zustandswert der auslösenden Entität, bei dessen Erreichen automatisch eine Aufgabe angelegt wird (z. B. "on").
      required: false
      selector:
        text:
    trigger_from_state:
      name: Ausgangszustand ("von")
      description: >-
        Optional, nur zusammen mit trigger_state sinnvoll. Löst nur aus,
        wenn die Entität AUS GENAU DIESEM Zustand in den Ziel-Zustand
        wechselt, statt bei jedem Erreichen des Ziel-Zustands.
      required: false
      selector:
        text:
    trigger_above:
      name: Wert über
      description: >-
        Optional, unabhängig von trigger_state nutzbar (auch
        gleichzeitig mit trigger_below für einen Wertebereich). Löst
        aus, sobald der (als Zahl interpretierte) Zustand diesen Wert
        von unten nach oben überschreitet.
      required: false
      selector:
        number:
          mode: box
    trigger_below:
      name: Wert unter
      description: >-
        Optional, unabhängig von trigger_state nutzbar. Löst aus,
        sobald der Zustand diesen Wert von oben nach unten
        unterschreitet.
      required: false
      selector:
        number:
          mode: box
    schedule_type:
      name: Zeitplan-Art
      description: >-
        Optional, unabhängig vom Entitäts-Trigger nutzbar. "days" legt
        alle X Tage eine Aufgabe an, "weekly" jede bzw. alle X Wochen an
        einem festen Wochentag (siehe schedule_interval/schedule_weekday).
        Duplikat-Schutz wie beim Entitäts-Trigger: keine neue Anlage,
        solange noch eine offene Aufgabe aus dieser Vorlage existiert.
      required: false
      selector:
        select:
          options:
            - label: "Alle X Tage"
              value: "days"
            - label: "Wöchentlich an festem Wochentag"
              value: "weekly"
    schedule_interval:
      name: Zeitplan-Intervall
      description: >-
        Bei Zeitplan-Art "days": alle X Tage. Bei "weekly": alle X
        Wochen (1 = jede Woche). Ohne Angabe: 1.
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box
    schedule_weekday:
      name: Zeitplan-Wochentag
      description: Nur bei Zeitplan-Art "weekly" erforderlich (0 = Montag ... 6 = Sonntag).
      required: false
      selector:
        select:
          options:
            - label: "Montag"
              value: "0"
            - label: "Dienstag"
              value: "1"
            - label: "Mittwoch"
              value: "2"
            - label: "Donnerstag"
              value: "3"
            - label: "Freitag"
              value: "4"
            - label: "Samstag"
              value: "5"
            - label: "Sonntag"
              value: "6"

update_template:
  name: Standardaufgabe bearbeiten
  description: >-
    Bearbeitet eine bestehende Standardaufgabe nachträglich. Nur
    angegebene Felder werden geändert. Bei trigger_entity_id/
    trigger_state sowie schedule_type entfernt ein LEERER Wert den
    jeweiligen Trigger bewusst. Nur für Administratoren.
  fields:
    template_id:
      name: Vorlagen-ID
      description: Die eindeutige ID der zu bearbeitenden Standardaufgabe.
      required: true
      selector:
        text:
    name:
      name: Titel
      required: false
      selector:
        text:
    description:
      name: Beschreibung
      required: false
      selector:
        text:
          multiline: true
    score:
      name: Punkte
      required: false
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    assigned_to:
      name: Zugewiesene Benutzer
      required: false
      selector:
        text:
          multiple: true
    multiscoring:
      name: Multiscoring
      required: false
      selector:
        boolean:
    trigger_entity_id:
      name: Auslösende Entität
      required: false
      selector:
        entity:
    trigger_state:
      name: Ziel-Zustand ("zu")
      required: false
      selector:
        text:
    trigger_from_state:
      name: Ausgangszustand ("von")
      required: false
      selector:
        text:
    trigger_above:
      name: Wert über
      description: Ein leerer Wert entfernt diese Bedingung bewusst.
      required: false
      selector:
        number:
          mode: box
    trigger_below:
      name: Wert unter
      description: Ein leerer Wert entfernt diese Bedingung bewusst.
      required: false
      selector:
        number:
          mode: box
    schedule_type:
      name: Zeitplan-Art
      description: Ein LEERER Wert entfernt den Zeitplan bewusst.
      required: false
      selector:
        select:
          options:
            - label: "Alle X Tage"
              value: "days"
            - label: "Wöchentlich an festem Wochentag"
              value: "weekly"
    schedule_interval:
      name: Zeitplan-Intervall
      required: false
      selector:
        number:
          min: 1
          max: 365
          mode: box
    schedule_weekday:
      name: Zeitplan-Wochentag
      required: false
      selector:
        select:
          options:
            - label: "Montag"
              value: "0"
            - label: "Dienstag"
              value: "1"
            - label: "Mittwoch"
              value: "2"
            - label: "Donnerstag"
              value: "3"
            - label: "Freitag"
              value: "4"
            - label: "Samstag"
              value: "5"
            - label: "Sonntag"
              value: "6"

remove_template:
  name: Standardaufgabe löschen
  description: >-
    Entfernt eine Standardaufgabe unwiderruflich. Bereits daraus
    erzeugte Aufgaben bleiben davon unberührt. Nur für Administratoren.
  fields:
    template_id:
      name: Vorlagen-ID
      description: Die eindeutige ID der zu löschenden Standardaufgabe.
      required: true
      selector:
        text:

create_task_from_template:
  name: Aufgabe aus Standardaufgabe anlegen
  description: >-
    Legt manuell eine (oder bei Multiscoring mehrere) konkrete, offene
    Aufgabe(n) aus einer Standardaufgabe an. Nur für Administratoren.
  fields:
    template_id:
      name: Vorlagen-ID
      description: Die eindeutige ID der Standardaufgabe.
      required: true
      selector:
        text:
